<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>錄音與上傳錯誤紀錄</title><style>body{font:14px system-ui,'Microsoft JhengHei';margin:20px auto;max-width:900px;padding:0 18px;background:#f8fafc;color:#172333}button{background:#174576;border:0;color:white;border-radius:7px;padding:10px 14px;cursor:pointer;margin:4px}button.danger{background:#a72b36}pre{white-space:pre-wrap;overflow-wrap:anywhere;border:1px solid #cbd5e1;border-radius:8px;background:white;padding:16px;min-height:220px;max-height:60vh;overflow:auto}p{line-height:1.6}</style></head><body><h2>錄音與 ChatGPT 上傳診斷紀錄</h2><p>這裡會記錄錄音啟動、音檔暫存、ChatGPT 連線、附件及自動送出的步驟。按「複製診斷紀錄」後，可以直接貼給我分析。紀錄不包含音檔內容或翻譯提示詞。</p><button id="refresh">重新整理</button><button id="copy">複製診斷紀錄</button><button id="clear" class="danger">清除診斷紀錄</button><span id="notice" role="status"></span><pre id="output">讀取中…</pre><script src="diagnostics.js"></script></body></html>
