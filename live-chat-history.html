<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>直播聊天室去重管理</title><style>
:root{font-family:system-ui,"Microsoft JhengHei",sans-serif;color:#172b48;color-scheme:light}*{box-sizing:border-box}body{margin:0;background:#f3f6fb;font-size:14px}main{max-width:920px;margin:26px auto;padding:0 18px}.top{background:linear-gradient(120deg,#102445,#244a78);color:white;padding:22px;border-radius:16px}h1{font-size:22px;margin:0 0 6px}.top p{margin:0;color:#d4e4f7}.panel{margin-top:16px;border-radius:14px;background:white;border:1px solid #dde5ef;padding:18px}.muted{color:#65758b;font-size:12px}button{border:0;background:#244b79;color:white;border-radius:9px;padding:10px 14px;font-weight:650;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}button.secondary{background:#edf3fa;color:#23476f}button.danger{background:#b83845}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{min-width:0}.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.metric{background:#f2f6fb;border-radius:10px;padding:12px}.metric strong{display:block;font-size:24px}.metric span{font-size:12px;color:#64758a}.filters{display:flex;gap:7px;margin:15px 0;flex-wrap:wrap}.filters button{background:#eff3f9;color:#254b77}.filters button.active{background:#244b79;color:white}.selection{display:grid;gap:7px;margin-bottom:12px}.selection label{font-weight:700;color:#183858}.selection select{width:100%;border:1px solid #cbd8e7;background:white;color:#173a5e;padding:11px;border-radius:9px;font:inherit}.record-info{display:grid;gap:6px;margin:8px 0 4px}.rows-shell{border:1px solid #e3eaf3;border-radius:12px;background:#fbfdff;max-height:470px;overflow-y:auto;padding:0 14px}.message{border-top:1px solid #edf1f5;padding:11px 0}.message:first-child{border-top:0}.message-head{display:flex;gap:10px;justify-content:space-between;align-items:center}.author{font-weight:700}.status{border-radius:99px;background:#e8eff9;color:#3b5472;padding:4px 9px;font-size:11px;font-weight:700;white-space:nowrap}.status.sent{background:#e2f6ed;color:#176b4c}.status.pending{background:#fff2df;color:#8b550c}.status.failed{background:#fdebec;color:#a13140}.message-text{margin-top:5px;white-space:pre-wrap;overflow-wrap:anywhere}.reason{margin-top:6px;color:#a54a55;font-size:12px}.empty{text-align:center;color:#6a7b8f;padding:28px 0}.notice{padding:11px;border-radius:9px;background:#fff6e5;color:#775213;margin-top:12px}#scope{overflow-wrap:anywhere}@media(max-width:540px){.metrics{gap:5px}.metric{padding:8px}.metric strong{font-size:20px}.actions button{flex:1 1 calc(50% - 8px)}}
</style></head><body><main><header class="top"><h1>直播聊天室去重管理</h1><p>查看上一次翻譯操作擷取與送出的訊息；不會在背景自動擷取。</p></header><section class="panel"><div class="selection"><label for="recordSelect">選擇直播紀錄與目標 ChatGPT 聊天室</label><select id="recordSelect" aria-label="選擇直播紀錄"><option value="">正在載入紀錄…</option></select></div><div id="scope" class="record-info muted">正在取得直播紀錄…</div><div class="actions" style="margin-top:12px"><button id="refresh">重新整理</button><button id="clearBatch" class="secondary">清除明細</button><button id="reset" class="danger">重設去重</button></div><p class="muted">「清除明細」只刪除選取直播的最後一次擷取明細；「重設去重」只刪除該直播與目標聊天室的去重識別碼。兩者皆不會刪除 ChatGPT 訊息或錄音。</p><p id="notice" role="status"></p></section><section class="panel"><h2>上一次翻譯擷取結果</h2><p id="time" class="muted"></p><div class="metrics"><div class="metric"><strong id="captured">0</strong><span>本次擷取</span></div><div class="metric"><strong id="skipped">0</strong><span>已略過重複</span></div><div class="metric"><strong id="sent">0</strong><span>本次已送出</span></div></div><div class="filters"><button class="active" data-filter="all">全部</button><button data-filter="sent">本次已送出</button><button data-filter="skipped">已略過重複</button><button data-filter="failed">傳送失敗</button></div><div class="rows-shell"><div id="rows" class="empty">尚無擷取紀錄</div></div></section></main><script src="live-chat-history.js"></script></body></html>
